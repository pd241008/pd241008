name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Core Options
          user: pd241008
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          
          # Commit & Push Output
          output_action: commit
          committer_message: "chore: update GitHub metrics [skip ci]"
          
          # Optimize Renderer & Styling
          config_animations: no
          plugins_errors_fatal: no
          
          # Tokyo Night Theme Styling (matches profile cards)
          extras_css: |
            svg {
              background: #1a1b27 !important;
              color: #a9b1d6 !important;
              border-radius: 8px !important;
            }
            :root {
              --color-calendar-graph-day-bg: #1f2335;
              --color-calendar-graph-day-border: rgba(255, 255, 255, 0.04);
              --color-calendar-graph-day-L1-bg: #41a6b5;
              --color-calendar-graph-day-L2-bg: #7aa2f7;
              --color-calendar-graph-day-L3-bg: #bb9af7;
              --color-calendar-graph-day-L4-bg: #f7768e;
            }
            h1, h2, h3 {
              color: #70a5fd !important;
            }
            .field svg {
              fill: #70a5fd !important;
            }
            .field {
              color: #a9b1d6 !important;
            }
            .field.warning, .field.warning svg, .footnote.warning svg {
              color: #e0af68 !important;
              fill: #e0af68 !important;
            }
            .avatar {
              border: 1px solid #70a5fd;
            }
            code, span.code {
              background-color: #24283b !important;
              color: #7dcfff !important;
            }
            .field.language.details small {
              color: #565f89 !important;
            }
          
          # Languages Plugin Config - Exclude generic/markup languages
          plugin_languages: yes
          plugin_languages_ignored: css, html, dockerfile, makefile, shell, json, yaml, markdown, text, toml, xml
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          
          # Deep Scan with Strict Limits
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
